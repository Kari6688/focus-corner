# Builds Focus Corner for macOS, Windows and Linux and publishes the installers
# to a GitHub Release named after the version in package.json.
#
# Runs when package.json (or this file) changes on main. If a release for the
# current version already exists, nothing is built — so to ship a new release,
# bump "version" in package.json and push. Can also be run from the Actions tab.

name: Release

on:
  push:
    branches: [main]
    paths: ['package.json', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      exists: ${{ steps.v.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v$version already exists — skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.exists == 'false'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build installers
        run: npx electron-builder --publish never
        env:
          # The app isn't code-signed yet; skip looking for signing certificates.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
          if-no-files-found: error

  release:
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Focus Corner v${{ needs.check.outputs.version }}
          files: installers/*
          generate_release_notes: true
          body: |
            ## Download

            | Your computer | File |
            |---|---|
            | Mac (Apple Silicon — M1/M2/M3/M4) | `FocusCorner-…-mac-arm64.dmg` |
            | Mac (Intel) | `FocusCorner-…-mac-x64.dmg` |
            | Windows | `FocusCorner-…-win-x64.exe` |
            | Linux | `FocusCorner-…-linux-x86_64.AppImage` |

            **First launch:** this build isn't signed with an Apple or Microsoft developer certificate yet, so your computer asks you to confirm once.
            - **Mac:** drag Focus Corner to Applications and open it. When macOS says it can't verify the app, click **Done**, then go to **System Settings → Privacy & Security**, scroll down, and click **Open Anyway** next to Focus Corner. (On older macOS: right-click the app → **Open** → **Open**.)
            - **Windows:** if SmartScreen appears, click **More info** → **Run anyway**.
